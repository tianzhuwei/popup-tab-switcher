<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab preview</title>
    <script src="./index.js" defer></script>
  </head>
  <body>
    <section class="preview" aria-label="Selected tab preview">
      <div class="preview__stage"></div>
      <div class="preview__placeholder" hidden>
        <img class="preview__placeholderIcon" alt="" />
        <div class="preview__placeholderDomain"></div>
        <div class="preview__placeholderText">No snapshot yet</div>
      </div>
      <footer class="preview__meta" hidden>
        <img class="preview__favicon" alt="" />
        <span class="preview__domain"></span>
        <span class="preview__time"></span>
      </footer>
    </section>
  </body>
</html>
