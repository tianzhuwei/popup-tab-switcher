<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab preview</title>
    <script src="./index.js" defer></script>
  </head>
  <body>
    <section class="preview" aria-label="Selected tab preview">
      <header class="preview__header">
        <div class="preview__title"></div>
        <div class="preview__url"></div>
      </header>
      <div class="preview__content">
        <img class="preview__image" alt="Selected tab screenshot" hidden />
        <div class="preview__empty" role="status">
          <svg
            class="preview__emptyIcon"
            viewBox="0 0 32 32"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <rect x="4" y="5" width="24" height="22" rx="4" />
            <path d="M4 11h24M9 8h1m3 0h1M10 17h12m-12 5h8" />
          </svg>
          <span>No preview yet</span>
        </div>
      </div>
    </section>
  </body>
</html>
